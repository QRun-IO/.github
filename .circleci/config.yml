# The org's CircleCI GitHub App builds every repository; without a config this repository
# reported "No configuration was found" as an error on every commit. Lint the workflows instead.
version: 2.1

jobs:
  actionlint:
    docker:
      - image: cimg/go:1.24
    steps:
      - checkout
      - run:
          name: Lint GitHub Actions workflows
          command: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color .github/workflows/*.yml

workflows:
  lint:
    jobs:
      - actionlint
