name: Workflow lint
'on':
  push:
    branches:
    - '**'
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  actionlint:
    uses: QRun-IO/qqq-orb/.github/workflows/workflow-lint.yml@0f33ddadf88b9a1b940b8883782fe2000ee1d2bd
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name
      != github.repository
